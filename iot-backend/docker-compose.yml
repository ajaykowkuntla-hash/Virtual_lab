version: '3.8'

services:
  db:
    image: postgres:15
    container_name: iot_framework_db
    environment:
      POSTGRES_USER: iotuser
      POSTGRES_PASSWORD: iotpassword
      POSTGRES_DB: iotdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:6.0
    container_name: judge0-redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    volumes:
      - judge0_redis_data:/data

  judge0-db:
    image: postgres:13
    container_name: judge0-db
    env_file: judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data

  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: judge0-server
    command: ["./scripts/server"]
    env_file: judge0.conf
    privileged: true
    ports:
      - "2358:2358"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-worker:
    image: judge0/judge0:1.13.0
    container_name: judge0-worker
    command: ["./scripts/workers"]
    env_file: judge0.conf
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      - judge0-db
      - judge0-redis

volumes:
  postgres_data:
  judge0_postgres_data:
  judge0_redis_data:
