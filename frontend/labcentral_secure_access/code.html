<style>

<body class="min-h-screen flex text-on-surface antialiased selection:bg-surface-container-high">
<!-- Split Layout Container -->
<div class="flex w-full min-h-screen">
<!-- Left Section: Illustration -->
<div class="hidden lg:flex w-1/2 relative bg-surface-lowest items-center justify-center p-edge_margin">
<!-- Subtle gradient orb behind illustration for depth -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-3/4 bg-neural-blue/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="relative w-full max-w-2xl aspect-[1.79] rounded-2xl overflow-hidden border-[0.5px] border-border-subtle shadow-sm bg-white">
<img alt="LabCentral Engineering Illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtaVMmdQi_d_3quBxZuGthpBwG_Vt5BlA-D4SNSyf5U09hlKlu04bNESGO1en3R2nmMQTSmtZJosPs9hqYYeS8KzkZ46AMSF6t0b6asfZOV93EYuzJWMBi06hkZ9zxORSiOo6ZrZBSM1yqaK3llCS_d7uHWcLt-T6UhYegK4Z11iscXysd_IDZL6F1g60OBrAov0nwLr_GEd84AlyUHKVVVMJDfjb5kBWXUhuIhQLoiJ1Mj81OxILhAycNBCSJqrjLfGctJ5DG8QlL">
</div>
<!-- Branding watermark overlay -->
<div class="absolute bottom-edge_margin left-edge_margin">
<p class="font-mono-metrics text-mono-metrics text-secondary opacity-50 tracking-widest uppercase">LABCENTRAL // SYS.ON</p>
</div>
</div>
<!-- Right Section: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-edge_margin lg:p-24 relative overflow-hidden bg-white">
<!-- Mobile subtle orb (hidden on desktop) -->
<div class="lg:hidden absolute top-0 right-0 w-64 h-64 bg-neural-purple/5 rounded-full blur-[80px] pointer-events-none -translate-y-1/2 translate-x-1/4"></div>
<!-- Login Card (Glassmorphism) -->
<div class="glass-card w-full max-w-md rounded-2xl p-8 lg:p-12 relative z-10">
<!-- Header -->
<div class="mb-10 text-center lg:text-left">
<div class="flex items-center justify-center lg:justify-start gap-2 mb-4">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">science</span>
<span class="font-h3 text-h3 font-semibold tracking-tight text-primary">DigiLab</span>
</div>
<h1 class="font-h2-mobile text-h2-mobile font-semibold text-primary mb-2">Welcome back.</h1>
<p class="font-body-md text-body-md text-secondary">Authenticate to access the virtual engineering lab.</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Student ID -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-primary tracking-wider uppercase" for="studentId">Student ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-sm">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-[0.5px] border-border-subtle rounded-xl bg-surface-container-lowest text-primary font-mono-metrics text-sm placeholder:text-outline transition-colors focus:border-primary focus:ring-0" id="studentId" name="studentId" placeholder="ENG-000000" required="" type="text">
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block font-label-caps text-label-caps text-primary tracking-wider uppercase" for="password">Password</label>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-sm">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-[0.5px] border-border-subtle rounded-xl bg-surface-container-lowest text-primary font-mono-metrics text-sm placeholder:text-outline transition-colors focus:border-primary focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<div class="flex justify-end pt-1">
<a class="font-mono-metrics text-mono-metrics text-secondary hover:text-primary transition-colors underline decoration-border-subtle underline-offset-4 hover:decoration-primary" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex items-center justify-center gap-2 bg-primary text-on-primary py-4 px-6 rounded-full font-label-caps text-label-caps tracking-widest uppercase hover:opacity-90 transition-opacity focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-lg shadow-primary/20" type="button">
                            Sign In
                            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Minimal Footer -->
<div class="mt-10 pt-6 border-t-[0.5px] border-border-subtle text-center">
<p class="font-mono-metrics text-mono-metrics text-secondary flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[10px]">lock</span>
                        Secure authentication via Institution SSO
                    </p>
</div>
</div>
</div>
</div>
